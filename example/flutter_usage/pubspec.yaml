name: icomoon_download_example
description: Flutter icomoon download example
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  icomoon_download:
    path: ../../

flutter:
  fonts:
    - family: IcomoonV1
      fonts:
        - asset: fonts/icomoon_v1.ttf
    - family: IcomoonV2
      fonts:
        - asset: fonts/icomoon_v2.ttf

icomoon_download:
  project_name: icomoon-generator
  host_id: "536abd6d67"
  is_temp: true
  revision: "1790741477"

  output_selection_file: fonts/selection_v2.json
  output_class_file: lib/ui/icons_v2.dart

  class_name: V2Icons
  family_name: IcomoonV2
  font_file_name: icomoon_v2.ttf
  format: true

  verbose: false